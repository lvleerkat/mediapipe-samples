name: Build Hand Landmarker APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/hand_landmarker/android/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/hand_landmarker/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hand-tracker-debug
          path: examples/hand_landmarker/android/app/build/outputs/apk/debug/*.apk
